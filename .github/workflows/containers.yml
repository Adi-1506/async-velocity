name: Containers
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-scan:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build image without production secrets
        run: docker build --build-arg NEXT_PUBLIC_API_URL=https://app.example.test --build-arg NEXT_PUBLIC_SOCKET_URL=https://app.example.test -t standup-${{ matrix.app }}:${{ github.sha }} ${{ matrix.app }}
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0
        with:
          image-ref: standup-${{ matrix.app }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - name: Verify backend runtime and native password hashing
        if: matrix.app == 'backend'
        run: docker run --rm --entrypoint /nodejs/bin/node standup-backend:${{ github.sha }} -e "require('./app').createApp(); require('bcrypt').hash('container-fixture-only',4).then(h=>require('bcrypt').compare('container-fixture-only',h)).then(ok=>process.exit(ok?0:1)).catch(()=>process.exit(1))"
      - name: Verify frontend serves the login page
        if: matrix.app == 'frontend'
        run: |
          docker run -d --name frontend-smoke -p 127.0.0.1:3000:3000 standup-frontend:${{ github.sha }}
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors --max-time 10 http://127.0.0.1:3000/login -o /tmp/login.html
          grep -q 'Welcome back' /tmp/login.html
      - name: Stop frontend smoke container
        if: always() && matrix.app == 'frontend'
        run: |
          docker logs frontend-smoke || true
          docker rm -f frontend-smoke || true
