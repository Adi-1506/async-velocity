name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: backend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm test
        working-directory: backend
      - name: Install checksum-verified database backup tools
        run: |
          curl --fail --silent --show-error --location https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.19.1.tgz -o "$RUNNER_TEMP/mongo-tools.tgz"
          echo "f34b84a67ab96b4ff52571ec5d15e2148d96cb140b1ea9ef8c29ac33c48e3480  $RUNNER_TEMP/mongo-tools.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mongo-tools.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/mongodb-database-tools-ubuntu2404-x86_64-100.19.1/bin" >> "$GITHUB_PATH"
      - run: npm run test:restore
        working-directory: backend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23'
      - run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - run: gitleaks git --redact --config .gitleaks.toml .
